# Dependabot configuration — see docs/agents/dependency-updates.md for the full
# version-authority policy and the rationale behind every choice here.
#
# Cadence is monthly (the 1st); updates arrive as few PRs as possible (one
# grouped minor/patch PR; each major on its own); and the Expo-governed native
# surface is never touched — that surface is realigned deliberately on the Expo
# track, keyed to Expo SDK releases.
version: 2

updates:
  # ── JavaScript / TypeScript: the pnpm workspace ─────────────────────────────
  # ONE directory, deliberately: "/". A pnpm workspace is a single dependency
  # graph resolved into a single root pnpm-lock.yaml, so the root job already
  # covers every member manifest (apps/api, apps/mobile, packages/shared), the
  # catalog in pnpm-workspace.yaml, and root-only tooling (eslint, husky, …).
  #
  # Listing members as extra `directories:` entries does not widen coverage — it
  # duplicates it. A per-member job cannot regenerate the root lockfile (outside
  # that job's scope), so its PR is dead on arrival: CI fails with
  # ERR_PNPM_OUTDATED_LOCKFILE before any real check runs. That produced a matched
  # pair of PRs for every apps/api bump (#198 vs #202, #200 vs #203).
  #
  # Add a directory here only for a package OUTSIDE the pnpm workspace carrying a
  # lockfile of its own — never for a workspace member.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # A named interval, not `cron`. The previous biweekly cron schedule used a
      # `cron:` sub-key that is not in the schema at all, so GitHub rejected the
      # whole file and Dependabot never ran once. `monthly` cannot fail that way
      # and has no cron-specific failure modes. (#191)
      interval: "monthly" # the 1st of each month
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    # The Expo SDK is the sole authority for the mobile native surface. Dependabot
    # must never bump these out of band — an independent version breaks the native
    # build. They are realigned via `expo install` on the deliberate Expo track.
    # NB: @better-auth/expo (scope @better-auth) and @expo-google-fonts/* (scope
    # @expo-google-fonts) are NOT Expo-governed and stay updatable — neither
    # pattern below matches them.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "@types/react"
      # eslint-config-expo is SDK-keyed (its major tracks the Expo SDK: 56.x for
      # SDK 56, 57.x for SDK 57) but lives in the repo-root package.json, so none
      # of the patterns above match it. Without this entry Dependabot would bump
      # it independently and lint the app against a different SDK's rules.
      - dependency-name: "eslint-config-expo"
    groups:
      # All minor + patch bumps batch into a single PR. Majors are deliberately
      # left ungrouped so each higher-risk bump opens its own PR for individual
      # review. Grouping on update-types (not dependency-type) sidesteps
      # dependabot-core#14824, which misclassifies every pnpm catalog entry as a
      # production dependency and would make a prod/dev split unreliable.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # ── GitHub Actions: keep CI tooling from silently rotting ───────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly" # see the note on the npm entry above
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
