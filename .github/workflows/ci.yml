name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      # The API suite runs against a real Postgres (no mocks). The test harness
      # defaults to postgres://kavtsya:kavtsya@localhost:5432/kavtsya_test
      # (apps/api/test/helpers/testDb.ts) and runs migrations itself, so the
      # container only has to exist with that user and database.
      db:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: kavtsya
          POSTGRES_PASSWORD: kavtsya
          POSTGRES_DB: kavtsya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kavtsya -d kavtsya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # On a pull_request the checkout is the merge commit, so HEAD^1 is the
          # base the PR is compared with (the Expo surface step below).
          fetch-depth: 2

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (version from engines.node)
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The expo-doctor checks that are a function of THIS diff. The SDK version
      # match reads Expo's live version map, so expo-sdk-check.yml runs it as a
      # monitor. Pinned so the gate's verdict changes only in the PR that bumps it,
      # by hand on the Expo track. Why both: docs/agents/dependency-updates.md,
      # "Gate vs monitor" and "Pin the gate's expo-doctor".
      - name: Expo Doctor (project health, excl. SDK version match)
        run: npx expo-doctor@1.20.4
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_SKIP_DEPENDENCY_VERSION_CHECK: "1"
          # A few checks call Expo's API; a network blip is not a broken PR.
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: "1"

      - name: Check agent setup
        run: pnpm agents:check

      - name: Check dependency graph
        run: pnpm deps:check

      # Dependabot only: the Expo track itself moves these packages on purpose.
      - name: Check Expo surface (Dependabot)
        if: startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
        run: node scripts/deps-check/expo-surface.mjs HEAD^1

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test
