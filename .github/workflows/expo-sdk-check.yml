name: Expo SDK check

# The FULL `expo-doctor`, including "Check that packages match versions required
# by installed Expo SDK". That one check resolves the expected set from Expo's
# live version map, so it can fail a commit that changed nothing the moment Expo
# publishes a patch. The other 20 checks are a function of the diff and run on
# every PR in ci.yml.
#
# So this workflow is a MONITOR ONLY. It runs on a schedule (+ manual) and turns
# a failure into a tracking issue, the trigger for the human-run Expo track in
# docs/agents/dependency-updates.md. Before this existed, drift was found by
# accident, via an unrelated PR going red.
#
# It deliberately does NOT gate pull requests (#232). It used to fail dependency
# PRs on the strict version match, on the reasoning that a dependency change is
# where alignment must hold. The cadence does not allow it: `expo` shipped 20
# stable releases in SDK 57 at a median 3 days apart, and #222 realigned
# everything on 2026-08-26 only for 10 packages to be behind again by 08-30. The
# aligned window is ~2-3 days, so the gate was red by default — a toll booth paid
# in either an unrelated realign or an override, and this repo already knows
# where merging through red leads (red `main`, 2026-07-29 to #167).
#
# It also never earned its keep: every real dependency defect here (#212, #223,
# #224/#226) was caught by a duplicate- or overridden-dependency check, all of
# which gate on every PR via ci.yml. Expo itself treats the version match as
# advisory ("There may be circumstances where you want to use a version of a
# package that is different from the version recommended by `npx expo install`"
# — https://expo.fyi/dependency-validation).

on:
  schedule:
    # Fortnightly (1st and 15th) — deliberately twice the Dependabot cadence,
    # which is monthly (see .github/dependabot.yml). Expo publishes inside an SDK
    # on its own schedule, so drift is worth catching sooner than dep bumps are.
    # GitHub cron is UTC-only, so 04:00 UTC lands at 06:00/07:00 Europe/Kyiv
    # depending on DST. Close enough for a monitor; do not chase the DST hour.
    - cron: "0 4 1,15 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  expo-doctor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v6

      - name: Set up Node (version from engines.node)
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # continue-on-error so a failure becomes a tracking issue instead of just a
      # red X nobody is watching. Nothing downstream fails the run.
      #
      # Deliberately NOT pinned, unlike the copy in ci.yml. That one is a merge
      # gate and must be a function of the diff; this one is a monitor whose whole
      # job is to notice drift against the outside world, so it should run the
      # newest checks. A new check finding real drift here is the feature.
      - name: Expo Doctor (full, incl. SDK version match)
        id: doctor
        continue-on-error: true
        working-directory: apps/mobile
        env:
          EXPO_DOCTOR_WARN_ON_NETWORK_ERRORS: "1"
        run: |
          set -o pipefail
          npx expo-doctor 2>&1 | tee "$RUNNER_TEMP/doctor.log"

      - name: Open a drift issue
        if: steps.doctor.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Expo SDK drift: mobile packages are behind the installed SDK"
        run: |
          existing=$(gh issue list --state open --label dependencies \
            --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "Drift issue #$existing is already open — leaving it alone."
            exit 0
          fi
          {
            echo "\`expo-doctor\` reports the mobile dependency set has drifted from the installed Expo SDK."
            echo
            echo "This is **not** a bug in any PR: the check resolves its expected versions from Expo's"
            echo "live version map, so it goes red on its own once Expo ships patches inside the SDK."
            echo
            echo "Fix it on the deliberate, human-run **Expo track** — never by hand-bumping and never"
            echo "via automation (see \`docs/agents/dependency-updates.md\`):"
            echo
            echo '```sh'
            echo "# from apps/mobile"
            echo "npx expo install --check   # report the drift"
            echo "npx expo install --fix     # realign to the SDK's known-good set"
            echo "npx expo-doctor            # validate"
            echo '```'
            echo
            echo "If \`react-native\` or any \`react-native-*\` package moves, rebuild the dev build and"
            echo "smoke the app before merging — that native surface is exactly what the rule protects."
            echo
            echo "<details><summary>expo-doctor output</summary>"
            echo
            echo '```'
            cat "$RUNNER_TEMP/doctor.log"
            echo '```'
            echo
            echo "</details>"
            echo
            echo "_Opened automatically by \`.github/workflows/expo-sdk-check.yml\` ([run](https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID))._"
          } > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$TITLE" --label dependencies --body-file "$RUNNER_TEMP/issue.md"
