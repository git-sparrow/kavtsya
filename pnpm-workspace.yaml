packages:
  - "apps/*"
  - "packages/*"

# Cross-workspace shared dependencies — the single source of truth for any
# library declared in two or more workspace packages. Referencing package.json
# files use the `catalog:` protocol so these versions cannot drift apart.
# See docs/agents/dependency-updates.md for the version-authority policy.
# NB: Expo-governed packages (react, react-native, expo-*, react-native-*,
# @types/react) are intentionally NOT catalog'd — they are mirrored from the
# Expo SDK via `expo install` and managed on the deliberate Expo track.
catalog:
  typescript: ~6.0.3
  vitest: ^2.1.9
  zod: ^3.23.8
  better-auth: ^1.6.19
  "@better-auth/expo": ^1.6.19
# One `react-dom` in the repo, and it is the one `react` is on. React refuses to
# run when the two disagree, so this is not a preference — it is the only version
# that works. Without it there are two: our pinned test-only copy, and a newer one
# pnpm auto-installs to satisfy better-auth's OPTIONAL `react-dom` peer. `expo`
# also declares `react-dom` as an optional peer, so a second copy silently forks
# `expo` itself into two resolutions and `expo-doctor` fails the install as
# duplicated. Pinned, never ranged: it moves with `react`, on the Expo track.
# (pnpm 11 reads `overrides` here, not from package.json.)
overrides:
  react-dom: 19.2.3
allowBuilds:
  # @swmansion/argent and its native deps (node-pty, tree-sitter*, webtransport)
  "@fails-components/webtransport-transport-http3-quiche": true
  "@swmansion/argent": true
  esbuild: true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  unrs-resolver: true
