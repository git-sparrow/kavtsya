packages:
  - "apps/*"
  - "packages/*"

# Cross-workspace shared dependencies — the single source of truth for any
# library declared in two or more workspace packages. Referencing package.json
# files use the `catalog:` protocol so these versions cannot drift apart.
# See docs/agents/dependency-updates.md for the version-authority policy.
# NB: Expo-governed packages (react, react-native, expo-*, react-native-*,
# @types/react) are intentionally NOT catalog'd — they are mirrored from the
# Expo SDK via `expo install` and managed on the deliberate Expo track.
catalog:
  typescript: ~6.0.3
  vitest: ^5.0.5
  vite: ^8.3.4
  zod: ^4.6.7
  better-auth: ^1.7.12
  "@better-auth/expo": ^1.7.12
# Peers are linked only where a package declares them, never auto-installed or
# borrowed from another workspace package. Otherwise apps/api links
# `@better-auth/expo`'s optional Expo peers from apps/mobile, resolves them apart
# from it and forks a second `expo`/`react-native`, failing Expo Doctor's duplicate
# check (#335). A missing-peer warning means: declare the peer where it is needed,
# or ignore it below with the reason. See docs/agents/dependency-updates.md.
autoInstallPeers: false
dedupePeerDependents: false
peerDependencyRules:
  ignoreMissing:
    # better-auth (beside @better-auth/expo in both apps, kept in step by the
    # catalog) pins @better-auth/core to its own version and carries core's peers.
    - "@better-auth/core"
    # Babel plugins' host: supplied by Expo's Metro toolchain (metro,
    # @expo/metro-config), which owns its version.
    - "@babel/core"
    # Web-only DOM UI (`@radix-ui/*`, `vaul`) via expo-router → @expo/ui; the app
    # ships no web target, and react-dom must never enter the tree (see docs).
    - react-dom
    # react-native-worklets lists it as a peer but never imports it; Metro config
    # comes from expo/metro-config.
    - "@react-native/metro-config"
allowBuilds:
  # @swmansion/argent and its native deps (node-pty, tree-sitter*, webtransport)
  "@fails-components/webtransport-transport-http3-quiche": true
  "@swmansion/argent": true
  esbuild: true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  unrs-resolver: true
  # Its postinstall only downloads a binary when the platform's optional
  # @sentry/cli-* package is missing (scripts/install.js, 3.8.0); pnpm installs
  # optional dependencies, so the binary always comes from there.
  "@sentry/cli": false
