packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  # @swmansion/argent and its native deps (node-pty, tree-sitter*, webtransport)
  "@fails-components/webtransport-transport-http3-quiche": true
  "@swmansion/argent": true
  esbuild: true
  node-pty: true
  tree-sitter: true
  tree-sitter-javascript: true
  tree-sitter-typescript: true
  unrs-resolver: true
