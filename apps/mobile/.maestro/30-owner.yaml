# CafeOwner — core operator surface, as seeded demo.owner@kavtsya.test (Free
# café «Кавярня «Демо»»). Every control is targeted by its `owner-*` / `*.back`
# testID; the only text left in a selector is the keyboard-dismiss tap.
#
# Two patterns this flow leans on, both learned from real flakes:
#   - `waitForAnimationToEnd` before every back tap. The subscreens animate in,
#     and a tap fired mid-push lands where the control *was*, reports COMPLETED,
#     and does nothing.
#   - `extendedWaitUntil` (never a bare `assertVisible`) after every back. The
#     CafeOwner home refetches on focus, so it can repaint a beat later.
appId: ${APP_ID}
tags:
  - gallery
---
- runFlow: subflows/reset-to-signed-out.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: "demo.owner@kavtsya.test"
- runFlow: subflows/dismiss-save-password.yaml
# A CafeOwner with no active Зміна must land in CafeOwner Mode, not Customer
# Mode — `owner-home.settings` is the gear only that Mode renders, so this
# asserts the dispatch (ADR 0015) rather than merely that something painted.
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/20-home
# Each operator entry: open it, capture, come back to the café home. Each
# subscreen's own back control is its `*.back` id — the shared "Назад"
# accessibility label matched every one of them at once.
- tapOn:
    id: "owner-home.scan"
- extendedWaitUntil:
    visible:
      id: "scan.viewfinder"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/21-scan
- waitForAnimationToEnd:
    timeout: 5000
# Tap inside a `repeat … while`, not as a bare `tapOn` (#249). A bare tap here
# misses most of the time: measured on one simulator, back to back, 5 of 6 bare
# taps left the app on the scan screen while 8 of 8 through this loop left it.
# On a miss the app never sees the touch at all — an instrumented build counted
# `onTouchStart` 0, so nothing cancelled it, it was simply never delivered. It is
# not the id, the push animation, the camera, or `delaysContentTouches` (each
# re-checked; the first two are excluded by `onTouchStart` 0 outright), and
# Argent's HID tap at the identical point on the identical screen navigates every
# time.
#
# What actually fixes it is the `while` guard, not the retry: evaluating it costs
# the driver a fresh view-hierarchy read right before the tap, and that is enough
# for the tap to land — all 8 passing runs needed exactly one tap, the retry never
# fired. `waitForAnimationToEnd` above does not substitute; it returns in ~0.3s.
# The retry is kept as the backstop, bounded by `times` so a genuinely stuck
# screen fails the run rather than spinning.
- repeat:
    times: 3
    while:
      visible:
        id: "scan.back"
    commands:
      - tapOn:
          id: "scan.back"
      - extendedWaitUntil:
          visible:
            id: "owner-home.settings"
          timeout: 6000
          optional: true
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
- tapOn:
    id: "owner-home.program"
- extendedWaitUntil:
    visible:
      id: "program-config.threshold"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/22-program
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "program-config.back"
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
- tapOn:
    id: "owner-home.shifts"
- extendedWaitUntil:
    visible:
      id: "shifts.back"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/23-shifts
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "shifts.back"
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
- tapOn:
    id: "owner-home.roster"
# The printed poster join-code (ADR 0013) is the roster's whole point — assert it
# rendered before the screenshot claims to show it.
- extendedWaitUntil:
    visible:
      id: "roster.poster-code"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/24-roster
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "roster.back"
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
# Free café → these two hit the Pro gate (pro_required pitch — ADR 0011). The
# pitch OfferCard renders only on Free, so its id is the gate assertion; the word
# "PRO" is not — that sits in the header kicker on both plans.
- tapOn:
    id: "owner-home.campaigns"
- extendedWaitUntil:
    visible:
      id: "campaigns.offer"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/25-campaigns-pro-pitch
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "campaigns.back"
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
- tapOn:
    id: "owner-home.analytics"
- extendedWaitUntil:
    visible:
      id: "analytics.offer"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/26-analytics-pro-pitch
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "analytics.back"
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
# Settings from the CafeOwner side: the same screen, a different Ролі section
# (ADR 0015 — each Mode speaks its own role's language).
- tapOn:
    id: "owner-home.settings"
- extendedWaitUntil:
    visible:
      id: "settings.appearance.system"
    timeout: 20000
- takeScreenshot: ${SHOTS}/owner/27-settings
- waitForAnimationToEnd:
    timeout: 5000
- tapOn:
    id: "settings.back"
- extendedWaitUntil:
    visible:
      id: "owner-home.settings"
    timeout: 20000
