# iOS pops a "Save Password?" keychain prompt after any credential submit. It's
# a SpringBoard system dialog (nothing to do with the app), so dismiss it when
# present — otherwise it sits over the post-auth gallery screenshots. Call this
# AFTER waiting for the role landing, so the dialog has already appeared.
appId: ${APP_ID}
---
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
