# iOS pops a "Save Password?" keychain prompt after any credential submit. It's a
# SpringBoard system dialog, and while it is up Maestro sees ONLY that dialog's
# window — no app element is visible to it, by id or by text (verified on iOS
# 26.5, Maestro 2.6.1).
#
# So this must run BEFORE the caller waits for its role landing, not after: the
# old order raced the prompt, and whenever the prompt won, the landing assertion
# failed against a screen that had in fact rendered correctly.
#
# Both steps are `optional` because the prompt is not guaranteed — iOS skips it
# once the credential is already stored, and it never appears on a flow that
# didn't submit one.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: "Save Password?"
    timeout: 6000
    optional: true
    label: "Wait for the keychain prompt, if iOS shows one"
- tapOn:
    text: "Not Now"
    optional: true
    label: "Dismiss the keychain prompt if it appeared"
