# Reusable: from the signed-out auth screen, sign in as ${EMAIL} using the shared
# ${DEMO_PASSWORD} (both provided by capture.sh via --env).
# The caller asserts its own role landing afterwards (Customer/Owner/Scanner),
# since each Mode paints a different first screen (ADR 0015).
#
# Selectors are the `sign-in.*` testIDs rather than the Ukrainian placeholders:
# copy churns with every redesign turn, ids don't (Maestro maps testID → id).
appId: ${APP_ID}
---
- assertVisible:
    id: "sign-in.submit"
- tapOn:
    id: "sign-in.email"
- inputText: ${EMAIL}
- tapOn:
    id: "sign-in.password"
# Read DEMO_PASSWORD straight from the global env (capture.sh --env) rather than
# a per-caller PASSWORD relay — the nested relay mis-typed the password.
- inputText: ${DEMO_PASSWORD}
# Tap the wordmark to dismiss the keyboard: `hideKeyboard` fails outright on
# the auth screen ("Couldn't hide the keyboard"), though it works elsewhere —
# see 40-owner-onboarding. The wordmark is a brand mark, not product copy, so
# it is not the kind of string a redesign turn rewrites.
- tapOn: "Кавця"
- tapOn:
    id: "sign-in.submit"
