# Scanner (Barista on an active Зміна) — the near-kiosk workstation.
#
# PREREQUISITE (state setup, not a pure UI flow): Scanner Mode only appears when
# /api/me/shift is non-null. The seeded barista@kavtsya.test is *rostered* but
# not on shift, so before this flow an owner must start a Зміна for them (via the
# owner Shifts screen, or a direct API/seed call). capture.sh skips this flow
# unless CAPTURE_SCANNER=1 is set, so the gallery run stays green by default.
appId: ${APP_ID}
tags:
  - gallery
  - scanner
---
- runFlow: subflows/reset-to-signed-out.yaml
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: "barista@kavtsya.test"
# With an active shift the app pins straight into the kiosk — the viewfinder is
# the Mode's own surface, so it doubles as the dispatch assertion.
- runFlow: subflows/dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: "scan.viewfinder"
    timeout: 20000
- takeScreenshot: ${SHOTS}/scanner/30-workstation
# The offline fallback (#21): a Зернятко can still be issued from a typed member
# code when the camera can't read the QR.
- tapOn:
    id: "scan.member-code-input"
- takeScreenshot: ${SHOTS}/scanner/31-manual-code
