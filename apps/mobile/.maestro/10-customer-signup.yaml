# Customer — first run: sign-up → member identity. The one flow that creates a
# new account, so it uses a fresh ${SIGNUP_EMAIL} each run (capture.sh generates
# a unique one) to stay re-runnable without a DB reset.
appId: ${APP_ID}
tags:
  - gallery
---
- runFlow: subflows/reset-to-signed-out.yaml
- takeScreenshot: ${SHOTS}/customer/01-signin
- tapOn:
    id: "sign-in.toggle-mode"
# The submit button carries the copy that tells the two modes apart, so this one
# assertion is deliberately on text: it is the thing being verified.
- assertVisible: "Зареєструватися"
- tapOn:
    id: "sign-in.name"
- inputText: "Олена"
- tapOn:
    id: "sign-in.email"
- inputText: ${SIGNUP_EMAIL}
- tapOn:
    id: "sign-in.password"
- inputText: ${DEMO_PASSWORD}
# Tap the wordmark to dismiss the keyboard: `hideKeyboard` fails outright on
# the auth screen ("Couldn't hide the keyboard"), though it works elsewhere —
# see 40-owner-onboarding. The wordmark is a brand mark, not product copy, so
# it is not the kind of string a redesign turn rewrites.
- tapOn: "Кавця"
- takeScreenshot: ${SHOTS}/customer/02-signup-filled
- tapOn:
    id: "sign-in.submit"
# A brand-new account owns no café, so the dispatcher must land in Customer Mode
# (ADR 0015). Anchoring on `customer-home.settings` — the Customer gear —
# asserts exactly that; the old shared "Налаштування" text anchor also matched
# CafeOwner Mode and so could not tell a mis-dispatch from a correct one.
- runFlow: subflows/dismiss-save-password.yaml
- extendedWaitUntil:
    visible:
      id: "customer-home.settings"
    timeout: 30000
- takeScreenshot: ${SHOTS}/customer/03-home
