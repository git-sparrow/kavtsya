executionPrerequisite: Stack running (pnpm db:up + dev:api on :3000 + Metro on
  :8081), demo world seeded (pnpm db:seed-demo), iOS simulator booted with Expo
  Go, camera pre-granted (xcrun simctl privacy booted grant camera
  host.exp.Exponent), and the DEMO OWNER (demo.owner@kavtsya.test) signed in —
  the flow taps «Режим Кавовара» from the home screen. Simulator udid is baked
  into steps; edit the YAML if the booted device changes.
steps:
  - echo: Restart Expo Go first — open-url alone does NOT reset a warm app's
      navigation stack, so a session already deep in a screen would stay there
  - tool: restart-app
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      bundleId: host.exp.Exponent
  - echo:
      Open the app at its root, wait for the home screen (owner variant shows
      «Режим Кавовара» button)
  - tool: open-url
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      url: exp://127.0.0.1:8081
  - tool: await-ui-element
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      condition: visible
      selector:
        text: Режим Кавовара
      timeoutMs: 30000
  - echo:
      Insurance tap near the top — dismisses Expo Go's first-connect dev-menu
      sheet if it covers the buttons; harmless on a clean screen
  - tool: gesture-tap
    delayMs: 500
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      x: 0.5
      y: 0.12
  - echo: Tapping «Режим Кавовара» (home screen, owner card) at 0.5, 0.754
  - tool: gesture-tap
    delayMs: 800
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      x: 0.5
      y: 0.754
  - tool: await-ui-element
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      condition: visible
      selector:
        text: Сканувати QR клієнта
      timeoutMs: 10000
  - echo: On owner mode screen — tapping «Сканувати QR клієнта» at 0.5, 0.513
  - tool: gesture-tap
    delayMs: 800
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      x: 0.5
      y: 0.513
  - echo:
      "Expect the scan screen: viewfinder + manual-entry field «Або введіть код
      клієнта» (#21)"
  - tool: await-ui-element
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
      condition: visible
      selector:
        text: Або введіть код клієнта
      timeoutMs: 10000
  - tool: screenshot
    args:
      udid: 4174BA11-C3D4-4A8E-8E72-0F5325BEC9A6
